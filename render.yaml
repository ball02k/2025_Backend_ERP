services:
  - type: web
    name: erp-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: npm run render-build
    startCommand: npm run render-start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.16.0
      - key: DATABASE_URL
        sync: false
      - key: PRISMA_MIGRATE_SHADOW_DATABASE_URL
        sync: false
      - key: MODEL_PROVIDER
        value: ollama
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.1:8b
      - key: ONLYOFFICE_DS_URL
        sync: false
      - key: ONLYOFFICE_JWT_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: FILE_STORAGE_DIR
        value: ./uploads/contracts
    autoDeploy: true
